global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: mailcore-api
    metrics_path: /metrics
    bearer_token_file: /run/mailcore-secrets/prometheus_scrape_token
    static_configs:
      - targets: ["app:8080"]

  - job_name: mailcore-host
    static_configs:
      - targets: ["node-exporter:9100"]
