server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  location / { try_files $uri $uri/ /index.html; }
  location /auth/ { proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /api/ { proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /health { proxy_pass http://app:8080; }
  location = /openapi.json { proxy_pass http://app:8080; }
  location /docs/ { proxy_pass http://app:8080; }
}
