# This file is included by the official Nginx image inside the http context.
limit_req_zone $binary_remote_addr zone=mailcore_auth:10m rate=10r/m;

# HTTP is retained only for an internal redirect. Compose does not publish it.
server {
  listen 80;
  server_name _;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;
  root /usr/share/nginx/html;

  ssl_certificate /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAILCORE_TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 2m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;

  location / { try_files $uri $uri/ /index.html; }
  location = /auth/login {
    limit_req zone=mailcore_auth burst=10 nodelay;
    proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT};
  }
  location /auth/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location /api/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location = /health { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location = /openapi.json { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location /docs/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
}
