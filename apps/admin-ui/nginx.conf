server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto http;
  location / { try_files $uri $uri/ /index.html; }
  location /auth/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location /api/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location = /health { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location = /openapi.json { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location /docs/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
}
