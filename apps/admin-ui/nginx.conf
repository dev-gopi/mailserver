# This file is included by the official Nginx image inside the http context.
limit_req_zone $binary_remote_addr zone=mailcore_auth:10m rate=10r/m;

# HTTP is retained only for an internal redirect. Compose does not publish it.
server {
  listen 80;
  server_name _;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;
  root /usr/share/nginx/html;

  ssl_certificate /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MAILCORE_TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The legacy UI still has inline event handlers and style attributes. Keep
  # unsafe-inline for compatibility; move handlers to external JS before
  # removing it and enabling a nonce/hash-based script policy.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'" always;
  proxy_hide_header Content-Security-Policy;

  client_max_body_size 2m;
  proxy_http_version 1.1;
  # Preserve a non-default public port (for example localhost:8443) so the
  # API can compare the browser Origin against the forwarded request origin.
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto https;

  location / { try_files $uri $uri/ /index.html; }
  # Server-sent events must not be buffered by the reverse proxy. Heartbeats
  # keep the connection active; the extended timeout allows long admin sessions.
  location = /api/events/stream {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT};
  }
  location = /auth/login {
    limit_req zone=mailcore_auth burst=10 nodelay;
    proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT};
  }
  location /auth/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location /api/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location = /health { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location = /openapi.json { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
  location /docs/ { proxy_pass http://${ADMIN_UI_API_HOST}:${ADMIN_UI_API_PORT}; }
}
