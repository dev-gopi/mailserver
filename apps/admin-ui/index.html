<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail Control</title><link rel="stylesheet" href="/styles.css"></head><body><main><section id="login" class="card"><h1>Mail Control</h1><p>Administrator access only.</p><form id="login-form"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p id="login-error" class="error"></p></section><section id="setup" class="card hidden"><h1>Change initial password</h1><p>Set a new administrator password before continuing.</p><form id="password-form"><label>Current password<input id="current-password" type="password" required></label><label>New password<input id="new-password" type="password" minlength="12" required></label><button>Save password</button></form><p id="setup-error" class="error"></p></section><section id="dashboard" class="hidden"><header><h1>Mail Control</h1><button id="logout">Sign out</button></header><div id="metrics" class="metrics"></div><div class="grid"><section class="card"><h2>Company setup</h2><form id="company-form"><label>Company name<input id="company-name" required></label><label>Support email<input id="support-email" type="email"></label><label>Timezone<input id="timezone" value="UTC" required></label><button>Save company</button></form></section><section class="card"><h2>Add domain</h2><form id="domain-form"><label>Domain<input id="domain-name" placeholder="example.com" required></label><button>Add domain</button></form><div id="domains"></div></section><section class="card"><h2>Create mailbox</h2><form id="mailbox-form"><label>Email<input id="mailbox-address" type="email" required></label><label>Display name<input id="mailbox-name"></label><label>Temporary password<input id="mailbox-password" type="password" minlength="12" required></label><button>Create mailbox</button></form></section><section class="card"><h2>Mailbox users</h2><div id="mailboxes"></div></section></div><p id="notice"></p></section></main><script src="/app.js"></script></body></html>
