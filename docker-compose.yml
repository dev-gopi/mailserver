x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  rspamd-policy-map-init:
    image: alpine:3.21
    command: ["/bin/sh", "/usr/local/bin/map-init.sh"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      # Existing policy-map files are owned by UID 1000 after initialization.
      # FOWNER permits chmod on those files on subsequent container starts.
      - FOWNER
    volumes:
      - ./services/rspamd/map-init.sh:/usr/local/bin/map-init.sh:ro
      - rspamdpolicydata:/maps
    restart: "no"
    logging: *service-logging

  # Retained only for optional A/B comparison during migration. This service is
  # not in the active mail path; Rspamd is the production filtering engine.
  spamassassin:
    profiles: ["legacy-comparison"]
    build: ./services/spamassassin
    volumes:
      - spamdata:/home/spamd
      - maildata:/var/mail/vhosts
    environment:
      - TZ=${TZ:?set TZ in .env}
    networks:
      - mailnet
      - filternet
      - clamavnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *service-logging
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x spamd >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5

  rspamd:
    image: rspamd/rspamd:4.3.0
    restart: unless-stopped
    command: ["/bin/sh", "-ec", "export RSPAMD_REDIS_PASSWORD=\"$$(cat /run/secrets/redis_password)\"; exec /usr/bin/rspamd -f"]
    secrets:
      - redis_password
    volumes:
      - ./services/rspamd/local.d:/etc/rspamd/local.d:ro
      - ./services/rspamd/rspamd.conf.override:/etc/rspamd/rspamd.conf.override:ro
      - rspamddata:/var/lib/rspamd
      - rspamdpolicydata:/var/lib/mailcore-rspamd-maps:ro
    networks:
      mailnet: {}     # outbound DNS and threat-feed access; no scanner listener binds here
      filternet:
        ipv4_address: 172.30.0.2
        aliases:
          - rspamd-filter
      dbnet: {}       # authenticated Redis/Bayes backend
      scanadminnet:
        ipv4_address: 172.32.0.2
        aliases:
          - rspamd-admin
      clamavnet:
        ipv4_address: 172.33.0.3
    depends_on:
      rspamd-policy-map-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Exercise the private HTTP scanner with a valid request. A bare TCP
      # connection to the Milter listener produces a misleading EOF error.
      test: ["CMD-SHELL", "rspamc -t 5 -h 172.32.0.2:11333 --empty symbols >/dev/null"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *service-logging

  # Optional only: Amavis is configured under services/amavis but is not part
  # of this project’s active mail path. Leave this service commented unless a
  # reviewed Postfix integration is added at the same time.
  # amavis:
  #   build: ./services/amavis
  #   container_name: mail_amavis
  #   restart: unless-stopped
  #   depends_on:
  #     - spamassassin
  #     - clamav
  #   networks:
  #     - mailnet
  #     - clamavnet

  clamav:
    # image: clamav/clamav:stable
    build: ./services/clamav
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *service-logging
    healthcheck:
      # Ubuntu's ClamAV packages do not provide clamdscan. Probe the daemon's
      # native TCP protocol instead, then require a downloaded daily database.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/172.33.0.2/3310 && printf \"PING\\n\" >&3 && IFS= read -r reply <&3 && test \"$$reply\" = PONG' && { test -s /var/lib/clamav/daily.cvd || test -s /var/lib/clamav/daily.cld; }"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10m
    environment:
      - TZ=${TZ:?set TZ in .env}
    volumes:
      - clamavdata:/var/lib/clamav
    networks:
      mailnet: {}     # outbound signature updates only; clamd binds to clamavnet
      clamavnet:
        ipv4_address: 172.33.0.2
        aliases:
          - clamav-scanner

  opendkim:
    build: ./services/opendkim
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging: *service-logging
    environment:
      - TZ=${TZ:?set TZ in .env}
      - MAIL_DB_PASSWORD_FILE=/run/secrets/opendkim_db_password
      - MAIL_DB_HOST=${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      - MAIL_DB_NAME=${POSTGRES_DB:?set POSTGRES_DB in .env}
      - MAIL_DB_USER=${OPENDKIM_DB_USER:-mail_opendkim}
    secrets:
      - opendkim_db_password
    volumes:
      - dkimkeys:/var/lib/opendkim
    networks:
      - mailnet
      - dbnet
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${OPENDKIM_PORT:?set OPENDKIM_PORT in .env}"]
      interval: 15s
      timeout: 3s
      retries: 5

  postfix:
    build: ./services/postfix
    secrets:
      - postfix_db_password
    volumes:
      - maildata:/var/mail/vhosts
      # Mount the directory so atomically replaced cert/key files are visible
      # to the daemon after a validated reload.
      - ./secrets/tls:/etc/mailcore/tls:ro
      - mailspool:/var/spool/postfix
      - postfixeventqueue:/var/spool/rsyslog
      - ./var/log/mailcore:/var/log/mailcore
    ports:
      - "${SMTP_PORT:?set SMTP_PORT in .env}:25"
      - "${SUBMISSION_PORT:?set SUBMISSION_PORT in .env}:587"
      - "${SMTPS_PORT:?set SMTPS_PORT in .env}:465"
    networks:
      mailnet: {}
      dbnet: {}
      filternet:
        aliases:
          - postfix-filter
      postfixcontrolnet:
        ipv4_address: 172.31.1.2
        aliases:
          - postfix-bridge
    restart: unless-stopped
    pids_limit: 512
    logging: *service-logging
    environment:
      - TZ=${TZ:?set TZ in .env}
      - DEBIAN_FRONTEND=noninteractive
      - MAIL_DB_PASSWORD_FILE=/run/secrets/postfix_db_password
      - MAIL_DB_HOST=${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      - MAIL_DB_NAME=${POSTGRES_DB:?set POSTGRES_DB in .env}
      - MAIL_DB_USER=${POSTFIX_DB_USER:-mail_postfix}
      - MAIL_DOMAIN=${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:?set MAIL_HOSTNAME in .env}
      - POSTFIX_BRIDGE_BIND=172.31.1.2
    depends_on:
      rspamd:
        condition: service_healthy
      opendkim:
        condition: service_healthy
      dovecot:
        condition: service_healthy
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      # postfix status confirms master is running. SMTPS handshake via openssl
      # validates TLS stack. Plain ports 25/587 are covered by postfix status —
      # probing them directly causes spurious pipelining warnings in the logs.
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1 && (printf 'QUIT\\r\\n' | openssl s_client -connect 127.0.0.1:465 -quiet 2>/dev/null; true)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dovecot:
    build: ./services/dovecot
    secrets:
      - dovecot_db_password
    volumes:
      - maildata:/var/mail/vhosts
      - ./secrets/tls:/etc/mailcore/tls:ro
      - mailspool:/var/spool/postfix
      - ./var/log/mailcore:/var/log/mailcore
    ports:
      - "${IMAPS_PORT:?set IMAPS_PORT in .env}:993"
      - "${POP3S_PORT:?set POP3S_PORT in .env}:995"
    networks:
      - mailnet
      - dbnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging: *service-logging
    environment:
      - TZ=${TZ:?set TZ in .env}
      - DEBIAN_FRONTEND=noninteractive
      - MAIL_DB_PASSWORD_FILE=/run/secrets/dovecot_db_password
      - MAIL_DB_HOST=${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      - MAIL_DB_NAME=${POSTGRES_DB:?set POSTGRES_DB in .env}
      - MAIL_DB_USER=${DOVECOT_DB_USER:-mail_dovecot}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "doveconf -n >/dev/null 2>&1 && bash -c '</dev/tcp/127.0.0.1/993' && bash -c '</dev/tcp/127.0.0.1/995'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MAIL_DOMAIN: ${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      MAIL_ADMIN_USERNAME: ${MAIL_ADMIN_USERNAME:-admin}
      MAIL_ADMIN_PASSWORD_HASH: ${MAIL_ADMIN_PASSWORD_HASH:?set MAIL_ADMIN_PASSWORD_HASH in .env}
    secrets:
      - postgres_password
    volumes:
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/postgresql/data
    networks:
      - dbnet
    restart: unless-stopped
    pids_limit: 256
    logging: *service-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    user: redis
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
    logging: *service-logging
    command: ["/bin/sh", "-ec", "umask 077; printf 'requirepass %s\n' \"$$(cat /run/secrets/redis_password)\" > /tmp/redis-secret.conf; exec redis-server /tmp/redis-secret.conf --appendonly yes --appendfsync everysec --maxmemory-policy noeviction"]
    secrets:
      - redis_password
    volumes:
      - redisdata:/data
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  monitor:
    image: curlimages/curl:8.10.1
    environment:
      HEALTH_URL: http://${ADMIN_UI_API_HOST:?set ADMIN_UI_API_HOST in .env}:${API_PORT:?set API_PORT in .env}/health
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    command: ["/bin/sh", "/opt/monitor/monitor.sh"]
    volumes:
      - ./infrastructure/monitor/monitor.sh:/opt/monitor/monitor.sh:ro
    networks:
      - mailnet
    restart: unless-stopped
    logging: *service-logging
    depends_on:
      app:
        condition: service_healthy

  # One-shot schema and role provisioning. The database container and this
  # runner receive the bootstrap credential; runtime APIs/mail daemons do not.
  migrate:
    build: ./apps/admin-api
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      NODE_ENV: production
      MAILCORE_MIGRATION_MODE: "true"
      PGHOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      PGPORT: ${POSTGRES_PORT:?set POSTGRES_PORT in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      API_DB_USER: ${API_DB_USER:-mail_api}
      API_DB_PASSWORD_FILE: /run/secrets/api_db_password
      POSTFIX_DB_USER: ${POSTFIX_DB_USER:-mail_postfix}
      POSTFIX_DB_PASSWORD_FILE: /run/secrets/postfix_db_password
      DOVECOT_DB_USER: ${DOVECOT_DB_USER:-mail_dovecot}
      DOVECOT_DB_PASSWORD_FILE: /run/secrets/dovecot_db_password
      OPENDKIM_DB_USER: ${OPENDKIM_DB_USER:-mail_opendkim}
      OPENDKIM_DB_PASSWORD_FILE: /run/secrets/opendkim_db_password
      AUTH_ENCRYPTION_KEY_FILE: /run/secrets/auth_encryption_key
      SESSION_COOKIE_SECURE: "true"
    secrets:
      - postgres_password
      - api_db_password
      - postfix_db_password
      - dovecot_db_password
      - opendkim_db_password
      - auth_encryption_key
    networks:
      - dbnet
    restart: "no"
    logging: *service-logging
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ./apps/admin-api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    pids_limit: 256
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:?set API_PORT in .env}
      PGHOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      PGPORT: ${POSTGRES_PORT:?set POSTGRES_PORT in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${API_DB_USER:-mail_api}
      PGPASSWORD_FILE: /run/secrets/api_db_password
      API_DB_USER: ${API_DB_USER:-mail_api}
      AUTH_ENCRYPTION_KEY_FILE: /run/secrets/auth_encryption_key
      SESSION_HOURS: ${SESSION_HOURS:-8}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      ADMIN_MAX_SESSIONS: ${ADMIN_MAX_SESSIONS:-5}
      SESSION_COOKIE_SECURE: "true"
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:?set REDIS_PORT in .env}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_QUEUE: ${REDIS_QUEUE:-mail_tasks}
      POSTFIX_HOST: ${POSTFIX_HOST:?set POSTFIX_HOST in .env}
      POSTFIX_PORT: ${POSTFIX_PORT:?set POSTFIX_PORT in .env}
      POSTFIX_BRIDGE_HOST: postfix-bridge
      POSTFIX_BRIDGE_PORT: ${POSTFIX_BRIDGE_PORT:?set POSTFIX_BRIDGE_PORT in .env}
      DOVECOT_HOST: ${DOVECOT_HOST:?set DOVECOT_HOST in .env}
      DOVECOT_PORT: ${DOVECOT_PORT:?set DOVECOT_PORT in .env}
      RSPAMD_HOST: rspamd-admin
      RSPAMD_PORT: 11333
      RSPAMD_POLICY_MAP_DIR: /var/lib/mailcore-rspamd-maps
      CLAMAV_HOST: clamav-scanner
      CLAMAV_PORT: ${CLAMAV_PORT:?set CLAMAV_PORT in .env}
      DKIM_KEY_DIR: /var/lib/opendkim/keys
      DKIM_KEY_UID: 10001
      MAIL_STORAGE_PATH: /var/mail/vhosts
      MAIL_DOMAIN: ${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:?set MAIL_HOSTNAME in .env}
      MAIL_PUBLIC_IP: ${MAIL_PUBLIC_IP:-}
      MX_PRIORITY: ${MX_PRIORITY:-10}
      SPF_RECORD: ${SPF_RECORD:-v=spf1 mx ~all}
      DMARC_POLICY: ${DMARC_POLICY:-quarantine}
      IMAPS_PORT: ${IMAPS_PORT:?set IMAPS_PORT in .env}
      IMAP_STARTTLS_PORT: ${IMAP_STARTTLS_PORT:?set IMAP_STARTTLS_PORT in .env}
      IMAP_STARTTLS_ENABLED: ${IMAP_STARTTLS_ENABLED:-false}
      POP3_STARTTLS_ENABLED: ${POP3_STARTTLS_ENABLED:-false}
      POP3S_PORT: ${POP3S_PORT:?set POP3S_PORT in .env}
      POP3_STARTTLS_PORT: ${POP3_STARTTLS_PORT:?set POP3_STARTTLS_PORT in .env}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      SUBMISSION_PORT: ${SUBMISSION_PORT:?set SUBMISSION_PORT in .env}
      SMTPS_PORT: ${SMTPS_PORT:?set SMTPS_PORT in .env}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-MailCore Admin Console}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      MAILCORE_EVENT_SYSLOG_BIND: 172.31.1.3
      MAILCORE_EVENT_SYSLOG_PORT: 6514
      TZ: ${TZ:-UTC}
      PROMETHEUS_SCRAPE_TOKEN_FILE: /run/mailcore-secrets/prometheus_scrape_token
    secrets:
      - api_db_password
      - auth_encryption_key
      - redis_password
    volumes:
      - mailcore_monitoring_secrets:/run/mailcore-secrets:ro
      - maildata:/var/mail/vhosts
      - dkimkeys:/var/lib/opendkim
      - rspamdpolicydata:/var/lib/mailcore-rspamd-maps
      - ./backups:/backups
    networks:
      mailnet: {}
      dbnet: {}
      scanadminnet:
        ipv4_address: 172.32.0.3
      clamavnet:
        ipv4_address: 172.33.0.4
      # Postfix owns .2 as the bridge listener; keep the admin API on a
      # stable, non-conflicting address.
      postfixcontrolnet:
        ipv4_address: 172.31.1.3
      monitoringnet: {}
    restart: unless-stopped
    logging: *service-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      rspamd-policy-map-init:
        condition: service_completed_successfully
      monitoring-secrets-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  admin-ui:
    build: ./apps/admin-ui
    ports:
      - "${ADMIN_UI_BIND_ADDRESS:-127.0.0.1}:${ADMIN_UI_HTTPS_PORT:-8443}:443"
    volumes:
      - ./secrets/tls:/etc/nginx/tls:ro
      - ./secrets/acme-webroot:/var/www/certbot:ro
      - ./var/log/mailcore:/var/log/mailcore:rw
    environment:
      ADMIN_UI_API_HOST: ${ADMIN_UI_API_HOST:?set ADMIN_UI_API_HOST in .env}
      ADMIN_UI_API_PORT: ${API_PORT:?set API_PORT in .env}
      ADMIN_UI_TRUSTED_PROXY_CIDR: ${ADMIN_UI_TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    networks:
      - mailnet
    restart: unless-stopped
    pids_limit: 128
    logging: *service-logging
    depends_on:
      app:
        condition: service_healthy

  # Initialize monitoring credentials in a named Docker volume. This avoids
  # file-backed bind mounts failing when a fresh host has no monitoring secret files.
  monitoring-secrets-init:
    image: alpine:3.21.3
    entrypoint: ["/bin/sh", "/init-monitoring-secrets.sh"]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - mailcore_monitoring_secrets:/run/mailcore-secrets
      - ./secrets/runtime:/legacy-secrets:ro
      - ./infrastructure/monitoring/init-monitoring-secrets.sh:/init-monitoring-secrets.sh:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    restart: "no"
    logging: *service-logging

  # Prometheus is an internal metrics backend. Grafana accesses it over the
  # monitoring network; it is intentionally not published on the host.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.wal-compression
      - --web.listen-address=:9090
    # ports:
    #   - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mailcore_monitoring_secrets:/run/mailcore-secrets:ro
      - prometheusdata:/prometheus
    networks:
      - monitoringnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging: *service-logging
    depends_on:
      monitoring-secrets-init:
        condition: service_completed_successfully
      app:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|host|run)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - monitoringnet
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *service-logging

  grafana:
    image: grafana/grafana:12.1.0
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/mailcore-secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_LOG_FILTERS: "live.push_http:error"
    volumes:
      - ./infrastructure/monitoring/grafana/entrypoint.sh:/entrypoint.sh:ro
      - mailcore_monitoring_secrets:/run/mailcore-secrets:ro
      - grafanadata:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoringnet
      # A separate bridge is required for Docker to publish Grafana's
      # loopback-only HTTP port. Monitoring traffic remains on the isolated
      # monitoring network.
      - grafanauinet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging: *service-logging
    depends_on:
      monitoring-secrets-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  # Loki provides the log datasource used by Grafana Explore. It is internal
  # only; Grafana is the sole UI exposed on the host.
  loki:
    image: grafana/loki:3.4.3
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infrastructure/monitoring/loki.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    networks:
      - monitoringnet
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging: *service-logging

  # Collect the existing MailCore service log files without a Docker-socket
  # mount. This avoids granting the log collector container Docker control.
  promtail:
    image: grafana/promtail:3.4.3
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infrastructure/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - ./var/log/mailcore:/var/log/mailcore:ro
      - promtailpositions:/run/promtail
    networks:
      - monitoringnet
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    pids_limit: 64
    logging: *service-logging
    depends_on:
      loki:
        condition: service_started

volumes:
  maildata:
  mailspool:
  dbdata:
  spamdata:
  clamavdata:
  dkimkeys:
  redisdata:
  rspamddata:
  rspamdpolicydata:
  postfixeventqueue:
  prometheusdata:
  grafanadata:
  mailcore_monitoring_secrets:
  lokidata:
  promtailpositions:

secrets:
  postgres_password:
    file: ./secrets/runtime/postgres_password
  api_db_password:
    file: ./secrets/runtime/api_db_password
  postfix_db_password:
    file: ./secrets/runtime/postfix_db_password
  dovecot_db_password:
    file: ./secrets/runtime/dovecot_db_password
  opendkim_db_password:
    file: ./secrets/runtime/opendkim_db_password
  redis_password:
    file: ./secrets/runtime/redis_password
  auth_encryption_key:
    file: ./secrets/runtime/auth_encryption_key

networks:
  mailnet:
    driver: bridge
  # Private east-west network for stateful backend services. It is isolated
  # from external routing; only services that need DB/cache access join it.
  dbnet:
    driver: bridge
    internal: true
  filternet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/28

  # Only the admin API and Rspamd HTTP normal worker join this private API network.
  scanadminnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/28

  # Scanner-only network shared by Rspamd, ClamAV and the trusted admin API.
  # Postfix is deliberately not attached, so it cannot call clamd directly.
  clamavnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.33.0.0/28

  # Dedicated point-to-point control plane for the queue bridge. The listener
  # binds only to the Postfix interface on this network; mail/scanner containers
  # cannot invoke queue flush, hold, release, or delete operations.
  postfixcontrolnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.1.0/28

  # Dedicated metrics plane. Grafana alone is published on host loopback.
  monitoringnet:
    driver: bridge
    internal: true
  # Grafana is the only member. Its published port remains loopback-bound by
  # the service-level ports declaration above.
  grafanauinet:
    driver: bridge
