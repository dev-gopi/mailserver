services:
  spamassassin:
    build: ./services/spamassassin
    volumes:
      - spamdata:/home/spamd
      - maildata:/var/mail/vhosts
    environment:
      - TZ=${TZ:?set TZ in .env}
    networks:
      - mailnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x spamd >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5

  clamav:
    # image: clamav/clamav:stable
    build: ./services/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pidof clamd >/dev/null && pidof clamsmtpd >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 8
    environment:
      - CLAMD_CONF_MaxFileSize=25M
      - CLAMD_CONF_MaxScanSize=100M
    volumes:
      - clamavdata:/var/lib/clamav
    networks:
      - mailnet

  opendkim:
    build: ./services/opendkim
    restart: unless-stopped
    volumes:
      - dkimkeys:/var/lib/opendkim
    networks:
      - mailnet
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${OPENDKIM_PORT:?set OPENDKIM_PORT in .env}"]
      interval: 15s
      timeout: 3s
      retries: 5

  postfix:
    build: ./services/postfix
    volumes:
      - maildata:/var/mail/vhosts
      - ./secrets/tls:/etc/ssl/certs:ro
      - mailspool:/var/spool/postfix
    ports:
      - "${SMTP_PORT:?set SMTP_PORT in .env}:25"
      - "${SUBMISSION_PORT:?set SUBMISSION_PORT in .env}:587"
      - "${SMTPS_PORT:?set SMTPS_PORT in .env}:465"
    networks:
      - mailnet
    restart: unless-stopped
    environment:
      - TZ=${TZ:?set TZ in .env}
      - DEBIAN_FRONTEND=noninteractive
      - MAIL_DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - MAIL_DB_HOST=${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      - MAIL_DB_NAME=${POSTGRES_DB:?set POSTGRES_DB in .env}
      - MAIL_DB_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - MAIL_DOMAIN=${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:?set MAIL_HOSTNAME in .env}
    depends_on:
      spamassassin:
        condition: service_healthy
      clamav:
        # ClamSMTP reinjects mail into Postfix, so Postfix must be started
        # before ClamAV waits for its Docker address. Health is still exposed
        # to monitoring, without creating a startup dependency cycle.
        condition: service_started
      opendkim:
        condition: service_healthy
      dovecot:
        condition: service_started
      db:
        condition: service_healthy

  dovecot:
    build: ./services/dovecot
    volumes:
      - maildata:/var/mail/vhosts
      - ./secrets/tls:/etc/ssl/certs:ro
      - ./secrets/tls:/etc/dovecot/private:ro
      - mailspool:/var/spool/postfix
    ports:
      - "${IMAPS_PORT:?set IMAPS_PORT in .env}:993"
      - "${POP3S_PORT:?set POP3S_PORT in .env}:995"
    networks:
      - mailnet
    restart: unless-stopped
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - MAIL_DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - MAIL_DB_HOST=${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      - MAIL_DB_NAME=${POSTGRES_DB:?set POSTGRES_DB in .env}
      - MAIL_DB_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MAIL_DOMAIN: ${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      MAIL_ADMIN_USERNAME: ${MAIL_ADMIN_USERNAME:-admin}
      MAIL_ADMIN_PASSWORD_HASH: ${MAIL_ADMIN_PASSWORD_HASH:?set MAIL_ADMIN_PASSWORD_HASH in .env}
    volumes:
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/postgresql/data
    networks:
      - mailnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backup:
    image: postgres:16
    environment:
      PGHOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      PGPORT: ${POSTGRES_PORT:?set POSTGRES_PORT in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infrastructure/backup/backup.sh:/opt/backup/backup.sh:ro
      - ./backups:/backups
      - maildata:/var/mail/vhosts:ro
    command: ["/bin/bash", "/opt/backup/backup.sh"]
    networks:
      - mailnet
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  monitor:
    image: curlimages/curl:8.10.1
    environment:
      HEALTH_URL: http://${ADMIN_UI_API_HOST:?set ADMIN_UI_API_HOST in .env}:${API_PORT:?set API_PORT in .env}/health
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    command: ["/bin/sh", "/opt/monitor/monitor.sh"]
    volumes:
      - ./infrastructure/monitor/monitor.sh:/opt/monitor/monitor.sh:ro
    networks:
      - mailnet
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  app:
    build: ./apps/admin-api
    env_file:
      - ./apps/admin-api/.env
    environment:
      PGHOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      PGPORT: ${POSTGRES_PORT:?set POSTGRES_PORT in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PORT: ${API_PORT:?set API_PORT in .env}
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:?set REDIS_PORT in .env}
      POSTFIX_HOST: ${POSTFIX_HOST:?set POSTFIX_HOST in .env}
      POSTFIX_PORT: ${POSTFIX_PORT:?set POSTFIX_PORT in .env}
      POSTFIX_BRIDGE_PORT: ${POSTFIX_BRIDGE_PORT:?set POSTFIX_BRIDGE_PORT in .env}
      DOVECOT_HOST: ${DOVECOT_HOST:?set DOVECOT_HOST in .env}
      DOVECOT_PORT: ${DOVECOT_PORT:?set DOVECOT_PORT in .env}
      SPAMASSASSIN_HOST: ${SPAMASSASSIN_HOST:?set SPAMASSASSIN_HOST in .env}
      SPAMASSASSIN_PORT: ${SPAMASSASSIN_PORT:?set SPAMASSASSIN_PORT in .env}
      CLAMAV_HOST: ${CLAMAV_HOST:?set CLAMAV_HOST in .env}
      CLAMAV_PORT: ${CLAMAV_PORT:?set CLAMAV_PORT in .env}
      DKIM_KEY_DIR: /var/lib/opendkim/keys
      DKIM_KEY_UID: 10001
      MAIL_DOMAIN: ${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:?set MAIL_HOSTNAME in .env}
      MAIL_PUBLIC_IP: ${MAIL_PUBLIC_IP:-}
      MX_PRIORITY: ${MX_PRIORITY:-10}
      SPF_RECORD: ${SPF_RECORD:-v=spf1 mx ~all}
      DMARC_POLICY: ${DMARC_POLICY:-quarantine}
      IMAPS_PORT: ${IMAPS_PORT:?set IMAPS_PORT in .env}
      IMAP_STARTTLS_PORT: ${IMAP_STARTTLS_PORT:?set IMAP_STARTTLS_PORT in .env}
      POP3S_PORT: ${POP3S_PORT:?set POP3S_PORT in .env}
      POP3_STARTTLS_PORT: ${POP3_STARTTLS_PORT:?set POP3_STARTTLS_PORT in .env}
      SUBMISSION_PORT: ${SUBMISSION_PORT:?set SUBMISSION_PORT in .env}
      SMTPS_PORT: ${SMTPS_PORT:?set SMTPS_PORT in .env}
    volumes:
      - dkimkeys:/var/lib/opendkim
    networks:
      - mailnet
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  admin-ui:
    build: ./apps/admin-ui
    ports:
      - "${ADMIN_UI_PORT:?set ADMIN_UI_PORT in .env}:80"
    environment:
      ADMIN_UI_API_HOST: ${ADMIN_UI_API_HOST:?set ADMIN_UI_API_HOST in .env}
      ADMIN_UI_API_PORT: ${API_PORT:?set API_PORT in .env}
    networks:
      - mailnet
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  maildata:
  mailspool:
  dbdata:
  spamdata:
  clamavdata:
  dkimkeys:
  redisdata:

networks:
  mailnet:
    driver: bridge
