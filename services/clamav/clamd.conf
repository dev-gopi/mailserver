# Logging
LogFile /var/log/clamav/clamd.log
LogSyslog yes
LogTime yes
LogVerbose yes

# Network (listen on all interfaces)
TCPSocket 3310
TCPAddr 0.0.0.0

# Limits
MaxFileSize 100M
StreamMaxLength 100M
MaxScanSize 150M
MaxFileSize 100M
MaxRecursion 20
MaxFiles 10000
MaxEmbeddedPE 40M

# Security / performance
Foreground yes
ScanMail yes
ScanArchive yes
DetectPUA no
HeuristicScanPrecedence yes

# Database directory (default for Debian/Ubuntu)
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes