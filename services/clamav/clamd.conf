# Logging
# LogFile /var/log/clamav/clamd.log
LogSyslog yes
LogTime yes
LogVerbose no

# Local socket for container tools (freshclam reload notifications, local scanning)
LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket yes
LocalSocketMode 660

# Listen only on the internal scanner network. Postfix is not attached to this network.
TCPSocket 3310
TCPAddr 172.33.0.2
User clamav

# Limits
MaxFileSize 50M
StreamMaxLength 60M
MaxScanSize 100M
MaxRecursion 20
MaxFiles 5000
MaxEmbeddedPE 40M

# Security / performance
Foreground yes
ScanMail yes
ScanArchive yes
# Treat potentially unwanted applications and malformed content as detections.
# These options can increase false positives, but are appropriate for the
# fail-closed inbound mail path.
DetectPUA yes
HeuristicScanPrecedence yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
# Do not silently accept content that was not fully scanned because it exceeded
# an archive, file-count, recursion, or size safety limit.
AlertExceedsMax yes

# Database directory (default for Debian/Ubuntu)
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
# Refuse to start with virus definitions older than two days so the mandatory
# antivirus path fails closed when signature updates stop succeeding.
FailIfCvdOlderThan 2
