clamav {
  type = "clamav";
  servers = "clamav:3310";
  scan_mime_parts = true;
  symbol = "CLAM_VIRUS";
  # The proxy converts this to Postfix milter quarantine/HOLD via
  # quarantine_on_reject. The message remains available only to an
  # administrator with queue access and is never delivered to recipients.
  action = "reject";
}
