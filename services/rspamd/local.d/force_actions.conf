# Mandatory antivirus inspection must never be bypassed on scanner failure.
# A soft reject is a temporary SMTP failure, so legitimate sending MTAs retry.
rules {
  CLAMAV_TEMPFAIL {
    action = "soft reject";
    expression = "CLAM_VIRUS_FAIL";
    message = "Temporary antivirus scanning failure; please retry later";
  }

  # Honor a sender domain's strongest published DMARC policy. Postfix holds
  # rejected messages for review, rather than silently delivering a spoof.
  DMARC_REJECT_POLICY {
    action = "reject";
    expression = "DMARC_POLICY_REJECT";
    message = "DMARC policy rejects this unauthenticated sender";
  }

  # These symbols are positive matches from curated phishing feeds, not merely
  # heuristic URL suspicion. Reject and retain them in the review queue.
  KNOWN_PHISHING_FEED {
    action = "reject";
    expression = "PHISHED_OPENPHISH | PHISHED_PHISHTANK";
    message = "Known phishing URL detected";
  }
}
