# Sender allowlists lower spam score only. They never skip SPF/DKIM/DMARC,
# phishing or ClamAV inspection.
MAILCORE_ALLOWED_SENDERS {
  type = "from";
  extract_from = "smtp";
  filter = "email:addr";
  map = "file:///var/lib/mailcore-rspamd-maps/allow_senders.map";
  score = -6.0;
  description = "MailCore organization sender allowlist (no antivirus bypass)";
}

MAILCORE_BLOCKED_SENDERS {
  type = "from";
  extract_from = "smtp";
  filter = "email:addr";
  map = "file:///var/lib/mailcore-rspamd-maps/block_senders.map";
  action = "reject";
  description = "MailCore blocked sender list";
}

MAILCORE_ALLOWED_SENDER_DOMAINS {
  type = "from";
  extract_from = "smtp";
  filter = "email:domain";
  map = "file:///var/lib/mailcore-rspamd-maps/allow_domains.map";
  score = -6.0;
  description = "MailCore organization sender-domain allowlist (no antivirus bypass)";
}

MAILCORE_BLOCKED_SENDER_DOMAINS {
  type = "from";
  extract_from = "smtp";
  filter = "email:domain";
  map = "file:///var/lib/mailcore-rspamd-maps/block_domains.map";
  action = "reject";
  description = "MailCore blocked sender-domain list";
}

MAILCORE_BLOCKED_ATTACHMENT_EXTENSIONS {
  type = "filename";
  filter = "extension";
  map = "file:///var/lib/mailcore-rspamd-maps/block_extensions.map";
  action = "reject";
  description = "MailCore prohibited attachment extensions";
}
