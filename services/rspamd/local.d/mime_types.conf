# Attachment and archive risk scoring. These signals add score; they do not
# blindly reject a file by extension. ClamAV remains the malware scanner.
bad_extensions {
  exe = 1;
  jar = 2;
  iso = 4;
  com = 4;
  bat = 4;
  ace = 4;
  arj = 2;
  cab = 3;
  lnk = 4;
  scr = 4;
  js = 4;
  vbs = 4;
  hta = 4;
  chm = 4;
  wsf = 4;
}

bad_archive_extensions {
  chm = 4;
  exe = 0.1;
  hta = 4;
  iso = 4;
  jar = 3;
  js = 0.5;
  lnk = 4;
  vbs = 4;
  wsf = 4;
}

archive_extensions {
  7z = 1;
  ace = 1;
  arj = 1;
  bz2 = 1;
  cab = 1;
  rar = 1;
  xz = 1;
  zip = 1;
}

archive_exceptions {
  docx = true;
  odp = true;
  ods = true;
  odt = true;
  pptx = true;
  vsdx = true;
  xlsx = true;
}
