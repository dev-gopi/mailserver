# GTUBE is the standard harmless anti-spam test pattern.  Rspamd does not
# enable a GTUBE symbol by default, so define one explicitly for the admin
# diagnostic and end-to-end mail-filter verification.
GTUBE {
  re = "body=/XJS\\*C4JDBQADN1\\.NSBN3\\*2IDNEN\\*GTUBE-STANDARD-ANTI-UBE-TEST-EMAIL\\*C\\.34X/";
  score = 20.0;
  description = "Generic Test for Unsolicited Bulk Email (GTUBE)";
  group = "spam";
}
