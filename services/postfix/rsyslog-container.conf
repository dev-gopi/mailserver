module(load="imuxsock")
# omfwd is a built-in output module in rsyslog — no explicit load() needed.
# module(load="omfwd")

global(workDirectory="/var/spool/rsyslog")

# Preserve normal container logs for operators.
*.* action(
  type="omfile"
  file="/dev/stdout"
  template="RSYSLOG_TraditionalFileFormat"
)

# Forward only the mail facility to the API's fixed private control-network
# address. Postfix is the only other service attached to this network. The
# persistent rsyslog action queue buffers events during short API restarts.
mail.* action(
  type="omfwd"
  target="172.31.1.3"
  port="6514"
  protocol="tcp"
  TCP_Framing="traditional"
  template="RSYSLOG_TraditionalForwardFormat"
  action.resumeRetryCount="-1"
  action.reportSuspension="on"
  queue.type="LinkedList"
  queue.filename="mailcore-event-forward"
  queue.size="10000"
  queue.maxDiskSpace="256m"
  queue.saveOnShutdown="on"
)

# Host-visible authentication telemetry consumed by host Fail2ban. The bind
# mount is restricted to this directory; Fail2ban never receives the Docker socket.
mail.* action(
  type="omfile"
  file="/var/log/mailcore/postfix.log"
  template="RSYSLOG_TraditionalFileFormat"
  createDirs="on"
  fileCreateMode="0640"
  dirCreateMode="0750"
)

