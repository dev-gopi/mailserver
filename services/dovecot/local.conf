# Use IMAP, POP3, and LMTP
protocols = imap pop3 lmtp

# Virtual users mail home and mailbox storage location
mail_home = /var/mail/vhosts/%d/%n
mail_location = maildir:~/Maildir
mail_privileged_group = vmail

# User and group IDs for virtual mail storage (vmail: 5000)
first_valid_uid = 5000
first_valid_gid = 5000

mail_uid = 5000
mail_gid = 5000

# Authentication mechanisms
auth_mechanisms = plain login
# Require encryption for every IMAP/POP3 client session. IMAPS/POP3S use
# implicit TLS; optional 143/110 listeners must negotiate STARTTLS first.
disable_plaintext_auth = yes

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
auth_verbose = no
auth_debug = no
auth_debug_passwords = no
mail_debug = no
# Add a fixed delay to failed logins so rapid password guessing is slower.
auth_failure_delay = 2 secs

mail_max_userip_connections = 50

passdb {
    driver = sql
    args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
    driver = sql
    args = /etc/dovecot/dovecot-sql.conf.ext
}

ssl = required

ssl_cert = </etc/mailcore/tls/cert.pem
ssl_key = </etc/mailcore/tls/privkey.key

# ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
# ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

# Strong SSL settings (optional, but recommended)
ssl_min_protocol = TLSv1.2
ssl_cipher_list = HIGH:!aNULL:!MD5
ssl_options = no_compression
ssl_prefer_server_ciphers = yes

service imap-login {
    inet_listener imap {
        port = 143
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}

service pop3-login {
    inet_listener pop3 {
        port = 110
    }
    inet_listener pop3s {
        port = 995
        ssl = yes
    }
}

service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0660
        user = vmail
        group = vmail
    }
}

service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = vmail
        group = vmail
    }

    unix_listener auth-userdb {
        mode = 0600
        user = vmail
        group = vmail
    }

    user = vmail
}

# Quota and Sieve plugins
mail_plugins = $mail_plugins quota

protocol imap {
    mail_plugins = $mail_plugins imap_quota
}

protocol lda {
    mail_plugins = $mail_plugins sieve quota
}

protocol lmtp {
    mail_plugins = $mail_plugins sieve quota
}

plugin {
    quota = maildir:User quota
    quota_rule = *:storage=0
    quota_grace = 10%%
    quota_status_success = DUNNO
    quota_status_nouser = DUNNO
    quota_status_overquota = "552 5.2.2 Mailbox is full / Quota exceeded"
    sieve_before = /var/mail/sieve/spam.sieve
    sieve_global_dir = /var/mail/sieve
}

service auth-worker {
    unix_listener auth-worker {
        mode = 0600
        user = vmail
        group = vmail
    }
}

namespace inbox {
    inbox = yes
    location = 
    prefix = 

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }

    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }

    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }

    mailbox "Sent Messages" {
        special_use = \Sent
        auto = no
    }

    mailbox Trash {
        special_use = \Trash
        auto = subscribe
    }

    mailbox Archive {
        special_use = \Archive
        auto = subscribe
    }
}
