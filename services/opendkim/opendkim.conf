# Containers do not run a syslog daemon; write diagnostics to stderr so they
# are retained by `docker compose logs`.
Syslog                  no
LogWhy                  yes
UMask                   007
Mode                    s
Socket                  inet:8891@0.0.0.0
PidFile                 /var/run/opendkim/opendkim.pid
UserID                  opendkim:opendkim
Canonicalization        relaxed/simple
KeyTable                refile:/var/lib/opendkim/KeyTable
SigningTable            refile:/var/lib/opendkim/SigningTable
InternalHosts           refile:/var/lib/opendkim/TrustedHosts
ExternalIgnoreList      refile:/var/lib/opendkim/TrustedHosts
On-BadSignature         reject
On-DNSError             tempfail
On-InternalError        tempfail
On-KeyNotFound          accept
On-NoSignature          accept
On-Security             tempfail
On-SignatureError       reject
