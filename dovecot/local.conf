# Use IMAP and POP3
protocols = imap pop3 lmtp

mail_location = maildir:~/Maildir
mail_privileged_group = vmail

# # Base directory for user's home/mail storage
# mail_home = /var/mail/vhosts/%d/%n

# # Actual mailbox location (Maildir format)
# mail_location = maildir:/var/mail/vhosts/%d/%n/Maildir

# Set default UID/GID (must match what's in your Docker image)
first_valid_uid = 5000
first_valid_gid = 5000

mail_uid = 5000
mail_gid = 5000

# Authentication using system users (Linux users)
auth_mechanisms = plain login
disable_plaintext_auth = no

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
auth_verbose = yes
auth_debug = yes
auth_debug_passwords = yes
mail_debug = yes

mail_max_userip_connections = 50

passdb {
    driver = sql
    args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
    driver = sql
    args = /etc/dovecot/dovecot-sql.conf.ext
}

ssl = yes 

ssl_cert = </etc/ssl/certs/cert.pem
ssl_key = </etc/ssl/certs/privkey.key

# ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
# ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

# Strong SSL settings (optional, but recommended)
ssl_min_protocol = TLSv1.2
ssl_cipher_list = HIGH:!aNULL:!MD5

service imap-login {
    inet_listener imap {
        port = 143
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}

service pop3-login {
    inet_listener pop3 {
        port = 110
    }
    inet_listener pop3s {
        port = 995
        ssl = yes
    }
}

service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        # mode = 0600
        mode = 0666
        user = vmail
        group = vmail
    }
}

service auth {
    unix_listener /var/spool/postfix/private/auth {
        # mode = 0660
        mode = 0666
        user = vmail
        group = vmail
    }

    unix_listener auth-userdb {
        mode = 0600
        user = vmail
        group = vmail
    }

    user = vmail
}

protocol lda {
    mail_plugins = $mail_plugins sieve
}

protocol lmtp {
    mail_plugins = $mail_plugins sieve
}

plugin {
    # sieve = ~/sieve/.dovecot.sieve
    sieve_before = /var/mail/sieve/spam.sieve
    sieve_global_dir = /var/mail/sieve
}

service auth-worker {
    unix_listener auth-worker {
        mode = 0666
        user = vmail
        group = vmail
    }
}

namespace inbox {
    inbox = yes
    location = 
    prefix = 

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }

    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }

    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }

    mailbox "Sent Messages" {
        special_use = \Sent
        auto = no
    }

    mailbox Trash {
        special_use = \Trash
        auto = subscribe
    }

    mailbox Archive {
        special_use = \Archive
        auto = subscribe
    }
}
